<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sandstride | Fornecedores</title>
<style>body:not(.finance-ready) #app,body:not(.finance-ready) #nav{display:none!important}</style>
<script src="finance-core.js"></script>
<style>
:root{--bg:#eee eec;--ink:#191919;--blue:#bdcaf6}*{box-sizing:border-box}body{margin:0;background:#eeefed;color:var(--ink);font:15px Arial,sans-serif}main{max-width:1320px;margin:auto;padding:28px 32px 100px}header{display:flex;align-items:center;justify-content:space-between;background:#191919;color:white;padding:25px 30px;border-radius:30px}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.muted{color:#777}nav{display:flex;gap:8px;margin:26px 0;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #ddd;border-radius:14px;padding:12px 16px}button{cursor:pointer;background:white;color:#191919}button.active,.primary{background:#191919;color:white;border-color:#191919}button:hover{filter:brightness(.94)}h1{font-size:34px;letter-spacing:-1px;margin:32px 0 8px}h2{font-size:22px}p{line-height:1.6}.notice{background:#e0e6fa;padding:13px 20px;border-radius:16px;margin:20px 0}.hero{background:#111;color:white;border-radius:32px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:24px}.hero strong{display:block;font-size:56px;letter-spacing:-2px;margin:16px 0}.hero small{color:#aaa}.pill{background:#bdcaf6;color:#191919;padding:9px 14px;border-radius:20px;display:inline-block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}.card{background:white;border-radius:25px;padding:25px}.card strong{font-size:29px;display:block;margin-top:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 18px;flex-wrap:wrap}.table{overflow:auto;background:white;border-radius:24px;padding:12px 24px}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:18px 12px;text-align:left;border-bottom:1px solid #eee}th{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:1px}tr:last-child td{border-bottom:0}.negative{color:#a63c35}.positive{color:#247b58}dialog{border:0;border-radius:26px;width:min(580px,95vw);padding:28px}dialog::backdrop{background:#0008}label{display:block;margin:14px 0 5px}input,select{width:100%;background:white}footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.empty{padding:32px;text-align:center;color:#777}.actions{display:flex;gap:12px;flex-wrap:wrap}.tiny{font-size:12px}a{color:inherit}.bars{display:flex;gap:8px;align-items:flex-end;height:65px}.bars i{background:#bdcaf6;width:26px;border-radius:5px 5px 0 0}@media(max-width:700px){main{padding:16px 14px 60px}header{padding:20px}.brand{font-size:20px}.hero{display:block;padding:25px}.hero strong{font-size:38px}.grid{grid-template-columns:1fr}.user{display:none}nav button{flex:1;font-size:13px;padding:10px}h1{font-size:28px}}@media print{header,nav,.notice,.actions,button,.toolbar input{display:none!important}main{padding:0}.hero{background:white;color:black}.table{padding:0}.grid{display:none}}
</style>
<main><header><div class="brand">➜ SANDSTRIDE <span style="font-weight:400;font-size:16px;letter-spacing:0"> / Fornecedores</span></div><span class="user">Lucas · Demonstração</span></header><div class="notice">Protótipo · Dados fictícios salvos somente neste navegador. Ainda não utilize para seu controle real.</div><nav id="nav"></nav><div id="app"></div><p class="muted tiny">Valores em reais · Pagamentos e abatimentos aplicados aos meses mais antigos · Demonstração independente da sua central.</p></main><dialog id="modal"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><footer><button type="button" onclick="modal.close()">Cancelar</button><button class="primary">Salvar</button></footer></form></dialog>
<script>
const money=FinanceCore.formatMoney,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=FinanceCore.businessDate;
const initial={suppliers:['W-BOX','PECHINCHA LIVRE','DARUJ','MARTS'],products:[{id:'p1',supplier:'W-BOX',name:'Tênis W-Box',prices:[{date:'2026-01-01',value:3700}]},{id:'p2',supplier:'DARUJ',name:'Running',prices:[{date:'2026-01-01',value:4500}]}],entries:[{id:'a',type:'purchase',date:'2026-10-01',supplier:'W-BOX',product:'Tênis W-Box',qty:150,unit:3700,value:555000},{id:'b',type:'purchase',date:'2026-10-02',supplier:'W-BOX',product:'Tênis W-Box',qty:237,unit:3700,value:876900},{id:'c',type:'purchase',date:'2026-11-02',supplier:'W-BOX',product:'Tênis W-Box',qty:100,unit:3700,value:370000},{id:'d',type:'payment',date:'2026-11-03',supplier:'W-BOX',value:807800},{id:'e',type:'purchase',date:'2026-10-20',supplier:'DARUJ',product:'Running',qty:100,unit:4500,value:450000}],audit:[]};
let db={suppliers:[],products:[],entries:[],audit:[]};let page='Painel',filter='';const app=document.getElementById('app'),modal=document.getElementById('modal');
function save(){localStorage.setItem('sandstride-demo-v1',JSON.stringify(db));render()}function active(s){return db.entries.filter(e=>!e.cancelled&&(!s||e.supplier===s))}function sum(es,t){return es.filter(e=>e.type===t).reduce((a,e)=>a+e.value,0)}
function balance(s){let es=active(s);return sum(es,'purchase')-sum(es,'payment')-sum(es,'credit')}function months(s){let m={};active(s).filter(e=>e.type==='purchase').forEach(e=>m[e.date.slice(0,7)]=(m[e.date.slice(0,7)]||0)+e.value);let rest=sum(active(s),'payment')+sum(active(s),'credit');return Object.keys(m).sort().map(k=>{let applied=Math.min(rest,m[k]);rest-=applied;return [k,m[k],applied,m[k]-applied]})}
const types={purchase:'Retirada',payment:'Pagamento',credit:'Abatimento'};function table(head,rows){return '<div class="table"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">Nenhum registro encontrado.</div>')+'</div>'}function options(list){return list.map(x=>'<option>'+esc(x)+'</option>').join('')}function navTo(p){page=p;filter='';render()}
function render(){document.getElementById('nav').innerHTML=['Painel','Fornecedores','Produtos e preços','Retiradas','Pagamentos','Relatórios'].map(p=>`<button class="${p===page?'active':''}" onclick="navTo('${p}')">${p}</button>`).join('');let es=active();app.innerHTML='<h1>'+page+'</h1><p class="muted">'+({Painel:'Sua operação, com cada conta no lugar.',Fornecedores:'Saldos e competências de cada parceiro.','Produtos e preços':'Preços com histórico. Compras anteriores preservadas.',Retiradas:'Registre as mercadorias recebidas.',Pagamentos:'Valores avulsos, sempre começando pelo mês mais antigo.',Relatórios:'Um extrato claro para compartilhar com o fornecedor.'}[page])+'</p>';
if(page==='Painel'){app.innerHTML+=`<section class="hero"><div><small>SALDO DEVEDOR TOTAL ATUAL</small><strong>${money(db.suppliers.reduce((a,s)=>a+Math.max(0,balance(s)),0))}</strong><span class="pill">${db.suppliers.filter(s=>balance(s)>0).length} fornecedores com saldo</span></div><div><div class="bars"><i style="height:32%"></i><i style="height:56%"></i><i style="height:43%"></i><i style="height:82%"></i><i style="height:65%"></i></div><p class="tiny muted">Ilustração · dados demonstrativos</p></div></section><div class="grid">${[['Compras registradas',sum(es,'purchase')],['Pagamentos registrados',sum(es,'payment')],['Abatimentos registrados',sum(es,'credit')]].map(([t,v])=>`<div class="card"><span class="muted">${t}</span><strong>${money(v)}</strong><small class="muted">Todo o período</small></div>`).join('')}</div><div class="toolbar"><h2>Por fornecedor</h2><div class="actions"><button onclick="openForm('purchase')">+ Retirada</button><button class="primary" onclick="openForm('payment')">+ Pagamento</button></div></div>`;supplierTable()}
if(page==='Fornecedores'){app.innerHTML+='<div class="toolbar"><span>Cadastro e saldo atual</span><button class="primary" onclick="openForm(\'supplier\')">+ Fornecedor</button></div>';supplierTable()}
if(page==='Produtos e preços'){app.innerHTML+='<div class="toolbar"><span>Tabela por fornecedor</span><button class="primary" onclick="openForm(\'product\')">+ Produto</button></div>';app.innerHTML+=table(['Fornecedor','Produto','Preço atual','Histórico',''],db.products.map(p=>[esc(p.supplier),esc(p.name),money(p.prices.at(-1).value),p.prices.map(v=>esc(v.date)+' · '+money(v.value)).join('<br>'),`<button data-action="price" data-id="${esc(p.id)}">Atualizar preço</button>`]))}
if(page==='Retiradas'||page==='Pagamentos'){let purchase=page==='Retiradas';app.innerHTML+=`<div class="toolbar"><span>Todos os registros · inclui cancelados</span><div class="actions">${purchase?'':'<button onclick="openForm(\'credit\')">+ Abatimento</button>'}<button class="primary" onclick="openForm('${purchase?'purchase':'payment'}')">+ ${purchase?'Retirada':'Pagamento'}</button></div></div>`;app.innerHTML+=table(['Data','Fornecedor','Tipo / produto','Quantidade','Valor','Situação','Ações'],db.entries.filter(e=>purchase?e.type==='purchase':e.type!=='purchase').map(e=>[esc(e.date),esc(e.supplier),esc(e.product||types[e.type]),e.qty||'—',money(e.value),e.cancelled?'Cancelado':'Registrado',e.cancelled?'—':`<button data-action="edit" data-id="${esc(e.id)}">Editar</button> <button data-action="cancel" data-id="${esc(e.id)}">Cancelar</button>`]))}
if(page==='Relatórios'){app.innerHTML+=`<div class="toolbar"><select style="width:auto" onchange="filter=this.value;render()"><option value="">Selecione um fornecedor</option>${db.suppliers.map(s=>`<option ${s===filter?'selected':''}>${esc(s)}</option>`).join('')}</select><div class="actions"><button onclick="csv()">Exportar CSV</button><button onclick="window.print()">Imprimir / PDF</button></div></div>`;if(filter){let list=active(filter).sort((a,b)=>a.date.localeCompare(b.date));let running=0;app.innerHTML+=table(['Competência','Compras','Pagamentos + abatimentos aplicados','Em aberto'],months(filter).map(r=>[esc(r[0]),...r.slice(1).map(money)]));app.innerHTML+='<h2>Extrato · '+esc(filter)+'</h2>'+table(['Data','Movimento','Produto','Quantidade','Valor','Saldo'],list.map(e=>{running+=e.type==='purchase'?e.value:-e.value;return [esc(e.date),types[e.type],esc(e.product||'—'),e.qty||'—',money(e.value),money(running)]}));app.innerHTML+='<p>Saldo atual: <b>'+money(balance(filter))+'</b></p>'}else app.innerHTML+='<div class="card">Escolha um fornecedor para consultar as retiradas por dia, os pagamentos e os saldos mensais.</div>'}}
function supplierTable(){app.innerHTML+=table(['Fornecedor','Compras','Pago','Abatimentos','Saldo atual',''],db.suppliers.map(s=>[esc(s),money(sum(active(s),'purchase')),money(sum(active(s),'payment')),money(sum(active(s),'credit')),`<b>${money(balance(s))}</b>`,`<button onclick="page='Relatórios';filter='${esc(s).replace(/'/g,'&#39;')}';render()">Ver extrato</button>`]))}
function field(label,name,type='text',value='',extra=''){return `<label>${label}</label><input required name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}function select(label,name,list){return `<label>${label}</label><select name="${name}">${options(list)}</select>`}let editing=null,kind='';
function openForm(type,id){kind=type;editing=id;let e=db.entries.find(e=>e.id===id);document.getElementById('formTitle').textContent=(e?'Editar ':type==='price'?'Atualizar ':'Novo registro · ')+(types[type]||{supplier:'Fornecedor',product:'Produto',price:'preço'}[type]);let html='';if(type==='supplier')html=field('Nome do fornecedor','name');else if(type==='price')html=field('Vigente a partir de','date','date',today())+field('Novo preço (R$)','value','number','','min="0.01" step="0.01"');else if(type==='product')html=select('Fornecedor','supplier',db.suppliers)+field('Nome do produto','name')+field('Preço inicial (R$)','value','number','','min="0.01" step="0.01"')+field('Vigente a partir de','date','date',today());else{html=select('Fornecedor','supplier',db.suppliers)+field('Data','date','date',e?.date||today());if(type==='purchase')html+=`<label>Produto</label><select name="product"></select>`+field('Quantidade','qty','number',e?.qty||1,'min="1" step="1"')+field('Preço por unidade (R$)','value','number',e?FinanceCore.formatInput(e.unit).replace(',','.'):'','min="0.01" step="0.01"')+'<p class="muted tiny">O preço é sugerido pela data da retirada. Você pode ajustá-lo para uma negociação excepcional.</p>';else html+=field('Valor (R$)','value','number',e?FinanceCore.formatInput(e.value).replace(',','.'):'','min="0.01" step="0.01"');html+=field('Observação / motivo da correção','note','text',e?.note||'');}document.getElementById('fields').innerHTML=html;let f=document.getElementById('form');if(e)f.elements.supplier.value=e.supplier;if(type==='purchase'){const update=()=>{let list=db.products.filter(p=>p.supplier===f.elements.supplier.value);f.elements.product.innerHTML=list.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');price()};const price=()=>{let p=db.products.find(p=>p.id===f.elements.product.value),v=p?.prices.filter(v=>v.date<=f.elements.date.value).at(-1);f.elements.value.value=v?FinanceCore.formatInput(v.value).replace(',','.'):''};f.elements.supplier.onchange=update;f.elements.product.onchange=price;f.elements.date.onchange=price;update();if(e){let p=db.products.find(p=>p.name===e.product&&p.supplier===e.supplier);if(p)f.elements.product.value=p.id;f.elements.value.value=FinanceCore.formatInput(e.unit).replace(',','.')}}modal.showModal()}
document.getElementById('form').onsubmit=ev=>{ev.preventDefault();let data=Object.fromEntries(new FormData(ev.target)),value=Math.round(Number(data.value)*100);if(kind==='supplier'){if(db.suppliers.includes(data.name.trim()))return alert('Fornecedor já cadastrado.');db.suppliers.push(data.name.trim())}else if(kind==='product')db.products.push({id:crypto.randomUUID(),supplier:data.supplier,name:data.name,prices:[{date:data.date,value}]});else if(kind==='price'){let p=db.products.find(p=>p.id===editing);if(data.date<=p.prices.at(-1).date)return alert('Use uma data posterior à última vigência.');p.prices.push({date:data.date,value})}else{let entry={id:editing||crypto.randomUUID(),type:kind,date:data.date,supplier:data.supplier,value,note:data.note};if(kind==='purchase'){let p=db.products.find(p=>p.id===data.product);if(!p)return alert('Cadastre um produto para este fornecedor.');entry.product=p.name;entry.qty=Number(data.qty);entry.unit=value;entry.value=value*entry.qty;}if(!Number.isSafeInteger(entry.value)||entry.value<=0)return alert('Valor inválido.');let i=db.entries.findIndex(e=>e.id===editing);if(i>=0){db.audit.push({at:new Date().toISOString(),before:structuredClone(db.entries[i]),after:entry});db.entries[i]=entry}else db.entries.push(entry)}modal.close();save()};
function cancelEntry(id){if(!confirm('Cancelar este registro e recalcular os saldos mensais?'))return;let e=db.entries.find(e=>e.id===id);db.audit.push({at:new Date().toISOString(),before:structuredClone(e),action:'cancel'});e.cancelled=true;save()}function csv(){if(!filter)return alert('Selecione um fornecedor.');let rows=[['Data','Tipo','Produto','Quantidade','Valor em reais'],...active(filter).map(e=>[e.date,types[e.type],e.product||'',e.qty||'',FinanceCore.formatInput(e.value).replace(',','.')])];let blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='extrato.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script><script src="interface.js"></script><script src="quality.js"></script><script src="receipts-ui.js"></script><script type="module" src="bootstrap.js"></script></html>
