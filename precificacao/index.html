    var row=a.r0+i, cobreTudo=a.c0===0&&linhaV.length>=cfg.h.length;

/* ---------- gravação de versões ---------- */
function o(x){return x===null||x===undefined?'':x;}
function linha(id,cat,v,r){return [id,v.prod,v.canal,brl(v.preco),cat,v.preco,v.variante||'',v.desc,v.cupom,1,o(v.frete),o(v.ads),o(v.outros),o(v.emb),v.reemb||0,'',Math.round(r.lucro*100)/100,'App',agora(),agora(),'',o(v.custo),o(v.imp),o(v.af),o(v.nfe)];}
function falha(err){S.busy=false;S.msg={t:'err',x:erroTexto(err)+' Confira os dados antes de tentar de novo: parte da gravação pode ter acontecido.'};atualizarPainel();}
function salvarVersao(acao){
  var e=S.ed, v=edV(); if(acao!=='arquivar'&&!(v.preco>0)){S.msg={t:'err',x:'Informe um preço de venda maior que zero.'};atualizarPainel();return;}
  S.busy=true;S.msg={t:'warn',x:'Gravando…'};atualizarPainel();
  var H=[], texto='', novoSel=e.id;
  carregarTudo().then(function(){
    var r=calc(v), nomeP=produto(S.produto).modelo+' '+pares(produto(S.produto).unid)+' · '+canal(S.canal).nome;
    var me=e.id?D.versoes.find(function(x){return x.id===e.id;}):null;
    if(e.id&&!me) throw {code:'tool_error',message:'a versão não foi encontrada'};
    if(acao==='arquivar'){
      H.push(hist('VERSOES',me.id,'status',me.status,'Arquivada','Arquivou a versão de '+brl(me.preco)+' ('+nomeP+')'));
      texto='Versão de '+brl(me.preco)+' arquivada.'; novoSel=null;
      return seq([['VERSOES!E'+me.row,[['Arquivada']]],['VERSOES!T'+me.row,[[agora()]]]]);
    }
    if(me){
      var L=linha(me.id,e.cat,v,r);
      H.push(hist('VERSOES',me.id,'preço / categoria',brl(me.preco)+' · '+me.status,brl(v.preco)+' · '+e.cat,'Alterou uma versão ('+nomeP+')'));
      texto='Versão salva: '+brl(v.preco)+' como '+e.cat.toLowerCase()+'.';
      return seq([['VERSOES!D'+me.row+':O'+me.row,[L.slice(3,15)]],['VERSOES!V'+me.row+':Y'+me.row,[L.slice(21,25)]],['VERSOES!T'+me.row,[[agora()]]]]);
    }
    var id='V'+Date.now().toString(36).toUpperCase(); novoSel=id;
    H.push(hist('VERSOES',id,'status','',e.cat,'Criou a versão de '+brl(v.preco)+' como '+e.cat.toLowerCase()+' ('+nomeP+')'));
    texto='Versão de '+brl(v.preco)+' criada como '+e.cat.toLowerCase()+'.';
    return garantirProduto(produto(S.produto)).then(function(){return anexar('VERSOES!A:Y',[linha(id,e.cat,v,r)]);});
  }).then(function(){ if(acao!=='arquivar'&&e.cat!=='Rascunho') texto+=' Lembre de conferir o preço no marketplace.'; return registrar(H);})
  .then(function(okH){ if(!okH) texto+=' Atenção: o registro no histórico falhou.'; return carregarTudo(); })
  .then(function(){S.busy=false;S.sel=novoSel;S.ed=null;render();toast(texto,'ok');}).catch(falha);
}
function salvarQtd(){

    var base=0, falta=[];

  });

function loteBase(){

    if(L.marca&&p.marca!==L.marca) return false;
    if(L.pares&&p.unid!==parseInt(L.pares,10)) return false;
    if(L.busca&&p.modelo.toLowerCase().indexOf(L.busca.toLowerCase())<0) return false;

  }).sort(function(a,b){var pa=produto(a.prod),pb=produto(b.prod);return pa.modelo.localeCompare(pb.modelo)||pa.unid-pb.unid||a.canal.localeCompare(b.canal)||a.preco-b.preco;});

function arred(p,modo,subir){
  if(modo==='nao'||!(p>0)) return Math.round(p*100)/100;
  var f=modo==='99'?0.99:0.90, a=Math.floor(p)+f; if(a<p-1e-9) a+=1; var b=a-1;
  if(subir) return Math.round(a*100)/100;
  return Math.round(((b>0&&p-b<a-p)?b:a)*100)/100;
}
function precoMargem(v,m){
  var p=produto(v.prod); if(!p) return null; var ini=Math.max(1,Math.floor(ov(v.custo,p.custo)*(v.qtd||1))), lim=ini*15, x;
  for(x=ini;x<=lim;x+=1){var r=calc(Object.assign({},v,{preco:x}));if(r&&r.liq>0&&r.margem>=m-1e-9)break;}
  if(x>lim) return null;
  for(var c=Math.max(ini*100,(x-1)*100);c<=x*100;c++){var r2=calc(Object.assign({},v,{preco:c/100}));if(r2&&r2.liq>0&&r2.margem>=m-1e-9)return c/100;}
  return x;
}

  if(t.id==='m-cor'){var lp=document.getElementById('m-logoprev');if(lp)lp.style.background=t.value;}
  if(t.getAttribute&&t.getAttribute('data-l')){var k=t.getAttribute('data-l');S.lote[k]=t.value;S.lote.conf=null;if(k==='tipo'){render();return;}clearTimeout(S.loteT);S.loteT=setTimeout(atualizarLote,250);return;}
  if(t.id==='mx-nome'){S.mixNome=t.value;return;}
  if(t.getAttribute&&t.getAttribute('data-mx')==='n'){S.mixLin[+t.getAttribute('data-i')].n=parseInt(t.value,10)||0;guardarMixNome();render();var e2=document.getElementById(t.id);if(e2){e2.focus();}return;}
  if(t.id==='busca'){S.busca=t.value;if(S.view!=='inicio'){S.ed=null;S.sel=null;S.cfg=null;S.mkt=null;S.editProd=false;irPara('inicio');}else render();return;}
  if(t.hasAttribute&&t.hasAttribute('data-g')){t.closest('.inp').classList.toggle('aj',t.value.trim()!==t.getAttribute('data-orig'));return;}
  var f=t.getAttribute&&t.getAttribute('data-f'); if(f==='ads'){var o1=document.getElementById(t.id==='f-ads'?'f-ads2':'f-ads');if(o1){o1.value=t.value;var bx=o1.closest('.inp');if(bx)bx.classList.toggle('aj',t.value.trim()!=='');}}
  if(f&&S.ed){S.ed[f]=t.value;if(f!=='margem')S.msg=null; var box=t.closest('.inp'); if(box&&AJ.some(function(x){return x[0]===f;})) box.classList.toggle('aj',t.value.trim()!==''); atualizarPainel();}
});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.id==='e-foto'&&t.files&&t.files[0]){enviarFotoProd(t.files[0]);t.value='';return;}
  if(t.getAttribute&&t.getAttribute('data-mx')==='id'){guardarMixNome();S.mixLin[+t.getAttribute('data-i')].id=t.value;render();return;}
  if(t.getAttribute&&t.getAttribute('data-lv')){if(t.checked)delete S.lote.fora[t.getAttribute('data-lv')];else S.lote.fora[t.getAttribute('data-lv')]=1;S.lote.conf=null;atualizarLote();return;}
  if(t.id==='l-todos'){var vs=loteBase();vs.forEach(function(v){if(t.checked)delete S.lote.fora[v.id];else S.lote.fora[v.id]=1;});S.lote.conf=null;atualizarLote();return;}if(t.id==='m-logo'&&t.files&&t.files[0]){enviarLogo(t.files[0]);return;}if(t.getAttribute&&t.getAttribute('data-f')==='variante'&&S.ed){S.ed.variante=t.value;atualizarPainel();}});

function iniciar(){
  S.erro=null;
  carregarTudo().then(function(){render();animar();}).catch(function(e){S.erro=erroTexto(e);render();});
}
window.__iniciarApp=iniciar;
})();

</script>
