<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sandstride Precificação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: barra lateral escura fixa + área de trabalho larga; na tela do produto, quadro de versões à esquerda e precificação fixa à direita */
:root{
  --bg:#EDEDEC; --card:#FFFFFF; --ink:#1A1A1A; --muted:#5E5E5E; --line:#E4E4E1; --chip:#EDEDEC; --hover:#F6F6F5;
  --side:#1A1A1A; --side-2:#1A1A1A; --on-side:#FFFFFF; --on-side-muted:#B9B9B5;
  --accent:#BCCBF5; --on-accent:#1A1A1A; --accent-ink:#2C3E7A; --sel:#3D57B8;
  --good:#1E7B45; --good-bg:#DDF3E5; --bad:#B42318; --bad-bg:#FDE5E2; --warn:#8A5A00; --warn-bg:#FFF1CC; --info:#2C3E7A; --info-bg:#E4EAFB;
  --k-prod:#2B2B2B; --k-mkt:#4A63C4; --k-frete:#2F9C95; --k-imp:#E0A33B; --k-com:#C45A9B; --k-mkg:#8E7CD6; --k-op:#B5B5AF; --k-luc:#2E9D5B;
  --c-principal:#232323; --c-ativo:#4A63C4; --c-testando:#E0A33B; --c-rascunho:#9A9A96;
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: tema-escuro-desligado){:root:not([data-theme="light"]){
  --bg:#121212; --card:#1D1D1D; --ink:#F2F2F0; --muted:#A9A9A5; --line:#2E2E2D; --chip:#2A2A29; --hover:#252524;
  --side:#232323; --side-2:#2C2C2C; --on-side:#FFFFFF; --on-side-muted:#A9A9A5;
  --accent:#BCCBF5; --on-accent:#1A1A1A; --accent-ink:#BCCBF5; --sel:#9DB0F2;
  --good:#5FD39A; --good-bg:#16301F; --bad:#FF8A80; --bad-bg:#3A1F1C; --warn:#F3D27A; --warn-bg:#3A3018; --info:#BCCBF5; --info-bg:#1F2740;
  --k-prod:#EDEDEA; --k-mkt:#7B8FE0; --k-frete:#4CC1B8; --k-imp:#F0B95A; --k-com:#E07BB8; --k-mkg:#A99AEB; --k-op:#6E6E6A; --k-luc:#5FD39A;
  --c-principal:#EDEDEA; --c-ativo:#7B8FE0; --c-testando:#F0B95A; --c-rascunho:#8A8A86;
  color-scheme:dark}}
:root[data-theme="escuro-desligado"]{
  --bg:#121212; --card:#1D1D1D; --ink:#F2F2F0; --muted:#A9A9A5; --line:#2E2E2D; --chip:#2A2A29; --hover:#252524;
  --side:#232323; --side-2:#2C2C2C; --on-side:#FFFFFF; --on-side-muted:#A9A9A5;
  --accent:#BCCBF5; --on-accent:#1A1A1A; --accent-ink:#BCCBF5; --sel:#9DB0F2;
  --good:#5FD39A; --good-bg:#16301F; --bad:#FF8A80; --bad-bg:#3A1F1C; --warn:#F3D27A; --warn-bg:#3A3018; --info:#BCCBF5; --info-bg:#1F2740;
  --k-prod:#EDEDEA; --k-mkt:#7B8FE0; --k-frete:#4CC1B8; --k-imp:#F0B95A; --k-com:#E07BB8; --k-mkg:#A99AEB; --k-op:#6E6E6A; --k-luc:#5FD39A;
  --c-principal:#EDEDEA; --c-ativo:#7B8FE0; --c-testando:#F0B95A; --c-rascunho:#8A8A86;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none;min-height:100%}
body{margin:0;min-height:100vh;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;align-items:start}
/* barra lateral */
.side{position:sticky;top:16px;min-height:calc(100vh - 32px);border-radius:28px;padding:22px 16px;display:flex;flex-direction:column;gap:18px;
  background:linear-gradient(180deg,var(--side-2) 0%,var(--side) 55%);box-shadow:0 12px 32px rgba(0,0,0,.10);color:var(--on-side)}
.side .logo{display:flex;align-items:center;padding:4px 6px}
.side .logo img{display:block;width:100%;max-width:190px;height:auto;filter:invert(1)}
.test{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:1.2px;padding:6px 10px;border-radius:12px;background:#FFF1CC;color:#6B4600;margin:0 6px}
.navv{display:flex;flex-direction:column;gap:6px}
.navv button{height:50px;border:0;border-radius:25px;background:transparent;color:var(--on-side);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:700;font-size:15px;text-align:left}
.navv button:hover{background:rgba(255,255,255,.08)}
.navv button[aria-current="page"]{background:#BCCBF5;color:#1A1A1A}
.navv svg *{stroke:currentColor}
.navv .count{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:#FDE5E2;color:#B42318}
.me{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 6px}
.me label{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--on-side-muted)}
.me input{height:42px;border-radius:21px;border:0;background:rgba(255,255,255,.1);color:#FFFFFF;padding:0 14px;font-weight:600}
.me input::placeholder{color:#9A9A96}
/* área principal */
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:56px}
.head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px}
.head .sp{flex:1}
.card{background:var(--card);border-radius:24px;padding:20px 22px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin:0}
.muted{color:var(--muted)}.sub{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.negc{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat .v{font-size:34px;font-weight:500;letter-spacing:-1px;margin-top:8px;font-variant-numeric:tabular-nums}
button.stat{border:0;text-align:left}
button.stat:hover{background:var(--hover)}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--card);padding:0 18px;min-width:280px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-weight:500}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.model{border:0;background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left}
.model:hover{background:var(--hover)}
.model .t{display:flex;align-items:center;gap:12px}
.thumb{width:52px;height:52px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.thumb{overflow:hidden;position:relative}
.thumb.tem{background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.big{width:64px;height:64px;border-radius:18px}
.thumb.sm{width:40px;height:40px;border-radius:12px}
.thumb.sm svg{width:20px;height:20px}
.cores{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
.corx{display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:6px 14px 6px 6px}
.corx-t{display:flex;flex-direction:column;line-height:1.25}
.corx-t b{font-size:13px}
.corx-t span{font-size:12px;margin:0}
.mixl{display:flex;flex-direction:column;gap:8px}
.mixrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mixres{display:flex;flex-direction:column;justify-content:center;min-height:44px}
.mixres b{font-size:16px}.mixres span{font-size:12.5px;color:var(--muted)}
.lote-f{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.lote-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.lote-cat{grid-column:span 2}
.lote-cat .catsel{flex-wrap:wrap}
.lote-aj{padding-top:14px;border-top:1px solid var(--line)}
.lote-sum{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:var(--card);border-radius:22px;padding:16px 20px;margin-bottom:14px}
.lote-sum>div:not(.lote-acts){display:flex;flex-direction:column;gap:3px}
.lote-sum b{font-size:15.5px;font-variant-numeric:tabular-nums}
.lote-acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lote-t tr.off td{opacity:.5}
.lote-t input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
.thumb path{stroke:var(--ink)}
.mname{font-weight:700;font-size:16px;letter-spacing:.3px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px;background:var(--chip);display:flex;align-items:center;gap:6px}
.cnt i{width:8px;height:8px;border-radius:4px;display:inline-block}
.reddot{width:9px;height:9px;border-radius:5px;background:#D92D20;display:inline-block}
.round{width:46px;height:46px;border-radius:23px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.round path{stroke:var(--ink)}
.seg{background:var(--card);border-radius:24px;padding:5px;display:inline-flex;gap:4px}
.seg button{height:38px;border:0;border-radius:19px;background:transparent;font-weight:600;padding:0 16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);font-weight:700}
.seg{position:relative}
.seg button{position:relative;z-index:1}
.seg-ind{position:absolute;left:0;top:0;height:38px;border-radius:999px;background:var(--ink);z-index:0;transition:transform .3s cubic-bezier(.3,.9,.3,1),width .3s cubic-bezier(.3,.9,.3,1),height .3s cubic-bezier(.3,.9,.3,1),opacity .2s;pointer-events:none}
.ind{position:relative}
.ind>button{position:relative;z-index:1}
.seg.ind button[aria-pressed="true"],#panel .catsel.ind button[aria-pressed="true"]{background:transparent;border-color:transparent}
.tabs.ind{display:inline-flex;width:fit-content;background:var(--card);border-radius:26px;padding:5px;gap:4px;max-width:100%}
.tabs.ind button{background:transparent}
.tabs.ind button[aria-selected="true"]{background:transparent}
.res .bar span{transition:width .4s cubic-bezier(.3,.9,.3,1)}
.res.res{background:linear-gradient(180deg,#2B2B2B 0%,#232323 60%)}
@media (prefers-reduced-motion: reduce){.seg-ind{transition:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{height:42px;padding:0 16px;border:0;border-radius:21px;background:var(--card);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.tabs .n{font-size:12px;opacity:.7;font-weight:600}
.pgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,1fr);gap:16px;align-items:start}
.panel{position:static;display:flex;flex-direction:column;gap:14px;border-radius:24px}
.board{display:flex;flex-direction:column;gap:14px}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cat-h i{width:10px;height:10px;border-radius:5px}
.cat-h h2{margin:0;font-size:15px;font-weight:700}
.cat-h .sub{margin-left:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vcard{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:118px}
.vcard:hover{background:var(--hover)}
.vcard[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel) inset}
.vprice{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.05;font-variant-numeric:tabular-nums}
.vprice small{font-size:15px;font-weight:600;margin-right:3px;color:var(--muted)}
.vl{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.principal .vprice{font-size:44px;letter-spacing:-1.4px}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:16px;color:var(--muted);font-size:13.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px 4px 7px;border-radius:10px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag svg{flex:none}.tag svg *{stroke:currentColor}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.good{background:var(--good-bg);color:var(--good)}.tag.info{background:var(--info-bg);color:var(--info)}
.btn{height:46px;border:0;border-radius:23px;font-weight:700;font-size:14.5px;background:var(--chip);padding:0 18px}
.btn.dark{background:var(--ink);color:var(--card)}.btn.acc{background:var(--accent);color:var(--on-accent)}.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.inp{display:flex;align-items:center;gap:8px;height:46px;border-radius:23px;background:var(--chip);padding:0 16px}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;outline:none}
.inp.lg{height:58px;border-radius:29px}.inp.lg input{font-size:26px}
.inp span{font-weight:600;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.catsel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.catsel button{height:40px;border:1.5px solid var(--line);border-radius:20px;background:transparent;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.catsel button i{width:8px;height:8px;border-radius:4px}
.catsel button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.res{background:repeating-linear-gradient(135deg,#232323 0 26px,#2B2B2B 26px 52px);color:#FFFFFF;border-radius:24px;padding:20px 22px}
.res .big{font-size:40px;font-weight:600;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin-top:6px}
.res .chip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:12px;background:#3A3A3A;color:#FFFFFF}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--chip)}
.res .bar{background:#3A3A3A;margin-top:16px}
.costs{display:flex;flex-direction:column}
.cost{display:grid;grid-template-columns:14px minmax(0,1fr) auto 56px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cost:last-child{border-bottom:0}
.cost .sw{width:14px;height:14px;border-radius:4px}
.cost .nm{font-weight:700;font-size:14px}.cost .dt{font-size:12.5px;color:var(--muted)}
.cost .vv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.cost .pp{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.cost .mb{grid-column:2 / -1;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.cost .mb span{display:block;height:5px;border-radius:3px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:8px;background:var(--bad-bg);color:var(--bad);margin-left:6px;text-transform:uppercase}
.lucrorow{display:flex;justify-content:space-between;padding:12px 0 2px;font-weight:700;font-size:16px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps button{border:0;border-radius:16px;background:var(--chip);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.steps button:hover{background:var(--hover);box-shadow:inset 0 0 0 1.5px var(--line)}
.steps b{font-size:14.5px;font-variant-numeric:tabular-nums}.steps small{font-size:11.5px;color:var(--muted);font-weight:600}
.mbox{background:var(--accent);color:#1A1A1A;border-radius:24px;padding:18px 20px}
.mbox .inp{background:#FFFFFF;color:#1A1A1A}
.note{border-radius:16px;padding:12px 16px;font-size:13.5px;font-weight:600;margin:0}
.note.ok{background:var(--good-bg);color:var(--good)}.note.err{background:var(--bad-bg);color:var(--bad)}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.info{background:var(--info-bg);color:var(--info)}
.choice{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.choice button{height:38px;border:1.5px solid currentColor;border-radius:19px;background:transparent;font-weight:700;padding:0 14px;color:inherit}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
details>summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--accent-ink);padding:2px 0;list-style-position:inside}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--hover)}
.tbl td.r,.tbl th.r{text-align:right}
.tinp{width:96px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums}
.tinp.changed{border-color:var(--sel);background:var(--info-bg)}
.cfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:700}
.skel{height:64px;border-radius:18px;background:var(--chip);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 32px));z-index:20}
.mtile{display:inline-flex;align-items:center;justify-content:center;border-radius:16px;height:64px;min-width:150px;padding:0 18px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.2px;flex:none}
.mtile.sm{height:24px;min-width:30px;border-radius:7px;padding:0 6px;font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.3px}
.mkts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mkt{border:0;background:var(--card);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left}
.mkt:hover{background:var(--hover)}
.mkt .mtile{width:100%;height:84px;font-size:28px}
.mkt-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:0 4px 4px;font-size:13px;color:var(--muted)}
.mkt-b b{color:var(--ink);font-variant-numeric:tabular-nums}.mkt-b .negc b,.mkt-b b.negc{color:var(--bad)}
.mname{display:block;font-weight:700;font-size:19px;letter-spacing:.4px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow .lbl{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.mrange{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

function montarMix(todos){
  var cru={}; todos.forEach(function(p){cru[p.id_produto]=p;});
  D.produtos.forEach(function(p){
    var raw=cru[p.id]&&String(cru[p.id].composicao||'').trim(); if(!raw) return;
    var partes=raw.split(';').map(function(x){var a=x.split(':');return {id:a[0].trim(),n:parseInt(a[1],10)||1};}).filter(function(x){return x.id;});
    var base=0, falta=[];
    partes.forEach(function(x){var c=produto(x.id); x.p=c&&!c.mix?c:null; if(x.p) base+=x.p.custo/x.p.unid*x.n; else falta.push(x.id);});
    var ck=num(cru[p.id].custo);
    p.mix=partes; p.mixFalta=falta; p.custoBase=base; p.unid=partes.reduce(function(a,x){return a+x.n;},0)||p.unid;
    p.custo=ck!==null?ck:base; p.custoProprio=ck!==null; if(!p.marca) p.marca='Kit misto';
  });
}

  else if(a==='versao'){var x=D.versoes.find(function(y){return y.id===v;});S.sel=v;montarEditor(x);render();}
  else if(a==='nova'){var base=ref(S.produto,S.canal);montarEditor(base||null);if(base){S.ed.id=null;S.ed.orig=null;S.ed.cat='Rascunho';}render();var f=document.getElementById('f-preco');if(f){f.focus();f.select();}}
  else if(a==='cancelarNova'){var y=D.versoes.find(function(z){return z.id===S.sel;});montarEditor(y||null);render();}
  else if(a==='duplicar'){S.ed.id=null;S.ed.orig=null;S.ed.cat='Rascunho';S.msg={t:'info',x:'Agora é uma versão nova, ainda não salva. Ajuste e clique em Criar versão.'};document.querySelectorAll('.vcard').forEach(function(c){c.setAttribute('aria-pressed','false');});renderPainel();}
  else if(a==='cat'){var cde=ondeEsta('#panel .catsel','aria-pressed');S.ed.cat=v;document.querySelectorAll('.catsel button').forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-v')===v));});deslizar(document.querySelector('#panel .catsel'),'aria-pressed',cde);atualizarPainel();}
  else if(a==='usarRoas'){if(!v)return;var vv=fmt(parseFloat(v));S.ed.ads=vv;['f-ads','f-ads2'].forEach(function(k){var x=document.getElementById(k);if(x){x.value=vv;var bx=x.closest('.inp');if(bx&&k==='f-ads')bx.classList.add('aj');}});atualizarPainel();}
  else if(a==='degrau'||a==='usarMargem'){if(!v)return;S.ed.preco=fmt(parseFloat(v));var g=document.getElementById('f-preco');if(g)g.value=S.ed.preco;S.msg=null;atualizarPainel();}
  else if(a==='salvar'){salvarVersao('salvar');}
  else if(a==='arquivar'){salvarVersao('arquivar');}
  else if(a==='comparar'){S.cmp=[];irPara('comparar');}
  else if(a==='cmpTog'){var i=S.cmp.indexOf(v);if(i>=0)S.cmp.splice(i,1);else{if(S.cmp.length>=4)S.cmp.shift();S.cmp.push(v);}render();}
  else if(a==='salvarLoja'){salvarLoja(v);}
  else if(a==='salvarGeral'){salvarGeral();}
  else if(a==='cfgMkt'){S.logoTmp=undefined;S.cfg=S.cfg===v?null:v;render();var mf=document.getElementById('mform');if(mf)mf.scrollIntoView({block:'nearest',behavior:'smooth'});}
  else if(a==='addFaixa'){var tb=document.querySelector('#m-faixas tbody');var last=[].slice.call(tb.querySelectorAll('tr')).filter(function(tr){return !tr.hidden;}).pop();var vr=last?last.querySelector('[data-k="variante"]').value:'Padrão';tb.insertAdjacentHTML('beforeend',linhaFaixa({row:'',variante:vr,min:0,max:Infinity,pct:0,fixo:0}));}
  else if(a==='delFaixa'){var tr=b.closest('tr');if(tr.getAttribute('data-row'))tr.hidden=true;else tr.remove();}
  else if(a==='salvarMkt'){salvarMkt();}
  else if(a==='removerMkt'){removerMkt(v,false);}
  else if(a==='removerMktOk'){removerMkt(v,true);}
  else if(a==='cancelRem'){document.getElementById('m-msg').innerHTML='';}
  else if(a==='tirarLogo'){guardarForm();S.logoTmp='';render();restaurarForm();}
  else if(a==='addProd'){S.addProd=!S.addProd;render();if(S.addProd)abrindo();var pn=document.getElementById('p-nome');if(pn)pn.focus();}
  else if(a==='salvarProd'){if(!S.busy)salvarProd();}
  else if(a==='editProd'){S.editProd=!S.editProd;S.fotoTmp=undefined;render();if(S.editProd)abrindo();}
  else if(a==='salvarEditProd'){if(!S.busy)salvarEditProd();}
  else if(a==='tirarFoto'){S.fotoTmp='';atualizarFotoForm();}
  else if(a==='remProd'){remProd(v,false);}
  else if(a==='remProdOk'){if(!S.busy)remProd(v,true);}
  else if(a==='cancelRemProd'){document.getElementById('e-msg').innerHTML='';}
  else if(a==='recarregar'){iniciar();}
  else if(a==='addMix'){S.addMix=!S.addMix;S.addProd=false;render();if(S.addMix)abrindo();}
  else if(a==='mixAdd'){guardarMixNome();S.mixLin.push({id:'',n:1});render();}
  else if(a==='mixDel'){guardarMixNome();S.mixLin.splice(parseInt(v,10),1);render();}
  else if(a==='salvarMix'){guardarMixNome();if(!S.busy)salvarMix();}
  else if(a==='loteCat'){S.lote.status[v]=!S.lote.status[v];S.lote.conf=null;render();}
  else if(a==='loteAtualizar'){S.lote.conf='atualizar';atualizarLote();}
  else if(a==='loteNovas'){S.lote.conf='novas';atualizarLote();}
  else if(a==='loteNao'){S.lote.conf=null;atualizarLote();}
  else if(a==='loteOk'){aplicarLote();}
});
document.addEventListener('keydown',function(ev){ if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('tr.click')) ev.target.click(); });
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='m-cor'){var lp=document.getElementById('m-logoprev');if(lp)lp.style.background=t.value;}
  if(t.getAttribute&&t.getAttribute('data-l')){var k=t.getAttribute('data-l');S.lote[k]=t.value;S.lote.conf=null;if(k==='tipo'){render();return;}clearTimeout(S.loteT);S.loteT=setTimeout(atualizarLote,250);return;}
  if(t.id==='mx-nome'){S.mixNome=t.value;return;}
  if(t.getAttribute&&t.getAttribute('data-mx')==='n'){S.mixLin[+t.getAttribute('data-i')].n=parseInt(t.value,10)||0;guardarMixNome();render();var e2=document.getElementById(t.id);if(e2){e2.focus();}return;}
  if(t.id==='busca'){S.busca=t.value;if(S.view!=='inicio'){S.ed=null;S.sel=null;S.cfg=null;S.mkt=null;S.editProd=false;irPara('inicio');}else render();return;}
  if(t.hasAttribute&&t.hasAttribute('data-g')){t.closest('.inp').classList.toggle('aj',t.value.trim()!==t.getAttribute('data-orig'));return;}
  var f=t.getAttribute&&t.getAttribute('data-f'); if(f==='ads'){var o1=document.getElementById(t.id==='f-ads'?'f-ads2':'f-ads');if(o1){o1.value=t.value;var bx=o1.closest('.inp');if(bx)bx.classList.toggle('aj',t.value.trim()!=='');}}
  if(f&&S.ed){S.ed[f]=t.value;if(f!=='margem')S.msg=null; var box=t.closest('.inp'); if(box&&AJ.some(function(x){return x[0]===f;})) box.classList.toggle('aj',t.value.trim()!==''); atualizarPainel();}
});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.id==='e-foto'&&t.files&&t.files[0]){enviarFotoProd(t.files[0]);t.value='';return;}
  if(t.getAttribute&&t.getAttribute('data-mx')==='id'){guardarMixNome();S.mixLin[+t.getAttribute('data-i')].id=t.value;render();return;}
  if(t.getAttribute&&t.getAttribute('data-lv')){if(t.checked)delete S.lote.fora[t.getAttribute('data-lv')];else S.lote.fora[t.getAttribute('data-lv')]=1;S.lote.conf=null;atualizarLote();return;}
  if(t.id==='l-todos'){var vs=loteBase();vs.forEach(function(v){if(t.checked)delete S.lote.fora[v.id];else S.lote.fora[v.id]=1;});S.lote.conf=null;atualizarLote();return;}if(t.id==='m-logo'&&t.files&&t.files[0]){enviarLogo(t.files[0]);return;}if(t.getAttribute&&t.getAttribute('data-f')==='variante'&&S.ed){S.ed.variante=t.value;atualizarPainel();}});

function iniciar(){
  S.erro=null;
  carregarTudo().then(function(){render();animar();}).catch(function(e){S.erro=erroTexto(e);render();});
}
window.__iniciarApp=iniciar;
})();

</script>
